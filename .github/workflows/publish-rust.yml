# Publishes the Rust SDK (crate `hermoso` on crates.io) when a version tag is pushed, or by hand for an existing tag
# (Run workflow, tag v0.1.4). crates.io Trusted Publishing (OIDC) needs no stored token, but crates.io only accepts a
# trusted publisher for a crate that already exists, so the FIRST version uses a one-time scoped token in the
# crates-io environment secret CARGO_REGISTRY_TOKEN; once the trusted publisher is added, delete that secret and the
# job uses OIDC. Skipped (not failed) until the repository variable PUBLISH_CRATES is "true".
name: Publish Rust SDK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing version tag to publish, e.g. v0.1.4'
        required: true
jobs:
  crates-io:
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: The tag names the version in Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$v" = "$TAG" || { echo "tag $TAG but Cargo.toml says $v"; exit 1; }
      - run: cargo build
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_TOKEN != 'true'
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
