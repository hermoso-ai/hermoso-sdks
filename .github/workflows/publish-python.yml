# Publishes the Python SDK (`hermoso` on PyPI) when a version tag is pushed. PyPI Trusted Publishing (OIDC): no token
# is stored anywhere. The TypeScript SDK (@hermoso/sdk) is published to npm by the same release.
name: Publish Python SDK
on:
  push:
    tags: ['v*']
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag names the version in pyproject.toml
        run: |
          v=$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject says $v"; exit 1; }
      - run: python -m pip install build==1.3.0
      - run: python -m build python
      - name: Smoke test the wheel
        run: |
          python -m pip install python/dist/*.whl
          python -c "import hermoso; from hermoso.api.posts import create_post; print(hermoso.__version__, hermoso.CONTRACT_VERSION)"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
