# Hand-written. src/apis and src/models are generated by tools/sdk-generate.mjs (openapi-generator `rust`,
# reqwest-trait); src/lib.rs and src/helpers.rs come from overlay/. The version line is rewritten by that script:
# every Hermoso SDK shares one version.
[package]
name = "hermoso"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
description = "Typed Rust client for the Hermoso API: generate ads, publish and schedule posts, read analytics, and call every Hermoso tool from your own backend."
license = "MIT"
authors = ["Hermoso <hello@hermoso.ai>"]
homepage = "https://hermoso.ai/docs/sdks/"
documentation = "https://docs.rs/hermoso"
repository = "https://github.com/hermoso-ai/hermoso-sdks"
readme = "README.md"
keywords = ["hermoso", "api", "sdk", "ads", "marketing"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*.rs", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream", "query", "form"] }
bon = { version = "3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["time"] }

[features]
default = ["rustls", "bon"]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
# Builders for every operation's parameter struct (ListPostsParams::builder().status(…).build()), so a parameter the
# API adds later never breaks a call site.
bon = ["dep:bon"]
