[project]
name = "hermoso"
version = "0.1.4"
description = "Typed Python client for the Hermoso API: generate ads, publish and schedule posts, read analytics, and call every Hermoso tool from your own backend."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hermoso", email = "hello@hermoso.ai" }]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.13.1,<3",
    "attrs>=22.2.0",
]
keywords = ["hermoso", "api", "sdk", "openapi", "ads", "ad generation", "social media", "scheduling", "marketing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://hermoso.ai/docs/sdks/"
Documentation = "https://hermoso.ai/docs/api/"
Source = "https://github.com/hermoso-ai/hermoso-sdks"
Issues = "https://github.com/hermoso-ai/hermoso-sdks/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermoso"]

[tool.hatch.build.targets.sdist]
include = ["hermoso", "README.md", "LICENSE", "pyproject.toml"]
